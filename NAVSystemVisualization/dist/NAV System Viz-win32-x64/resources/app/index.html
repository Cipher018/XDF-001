<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDF-001 NAV Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">

    <!-- ═══════════ Left Sidebar ═══════════ -->
    <aside class="sidebar glass-panel">

        <!-- Header -->
        <div class="sidebar-header">
            <h1 data-i18n="app_title">NAV 3D Viz</h1>
            <button id="lang-toggle" class="btn-icon">EN / ES</button>
        </div>

        <!-- Mode toggle -->
        <div class="control-group">
            <label data-i18n="mode_label">Navigation Mode</label>
            <div class="toggle-switch-container">
                <button id="mode-waypoint" class="btn-toggle active" data-i18n="mode_waypoint">Waypoint</button>
                <button id="mode-orbit"    class="btn-toggle"        data-i18n="mode_orbit">Orbit</button>
            </div>
        </div>

        <!-- Drone State -->
        <div class="control-section">
            <h3 data-i18n="drone_state">Drone State</h3>

            <!-- Position row: X  Y  Z -->
            <div class="row-label"><small>Position (m)</small></div>
            <div class="input-row">
                <div class="input-field"><label>X</label><input type="number" id="drone-x" value="0"   step="1"></div>
                <div class="input-field"><label>Y</label><input type="number" id="drone-y" value="-50" step="1"></div>
                <div class="input-field"><label>Z</label><input type="number" id="drone-z" value="0"   step="1"></div>
            </div>

            <!-- Attitude row: Heading  Pitch  Speed -->
            <div class="row-label"><small>Attitude / Speed</small></div>
            <div class="input-row">
                <div class="input-field">
                    <label data-i18n="heading">Hdg°</label>
                    <input type="number" id="drone-heading" value="90"  step="1" min="0" max="360">
                </div>
                <div class="input-field">
                    <label data-i18n="pitch">Pitch°</label>
                    <input type="number" id="drone-pitch"   value="0"   step="1" min="-90" max="90">
                </div>
                <div class="input-field">
                    <label data-i18n="speed">Spd m/s</label>
                    <input type="number" id="drone-speed"   value="10"  step="1" min="0">
                </div>
            </div>
        </div>

        <!-- Target / Orbit Center -->
        <div class="control-section">
            <h3 id="target-title" data-i18n="target_waypoint">Target Waypoint</h3>

            <!-- Position row: X  Y  Z -->
            <div class="input-row">
                <div class="input-field"><label>X</label><input type="number" id="target-x" value="100" step="1"></div>
                <div class="input-field"><label>Y</label><input type="number" id="target-y" value="100" step="1"></div>
                <div class="input-field"><label>Z</label><input type="number" id="target-z" value="20"  step="1"></div>
            </div>

            <!-- Orbit-only params (hidden in waypoint mode) -->
            <div id="orbit-specific-inputs" class="input-row" style="display:none;">
                <div class="input-field">
                    <label data-i18n="orbit_radius">Rad m</label>
                    <input type="number" id="orbit-radius" value="50" step="1" min="5">
                </div>
                <div class="input-field">
                    <label data-i18n="orbit_dir">Dir</label>
                    <select id="orbit-dir">
                        <option value="cw"  data-i18n="dir_cw">CW</option>
                        <option value="ccw" data-i18n="dir_ccw">CCW</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Update button -->
        <button id="btn-update" class="btn-primary" data-i18n="update_viz">Update Visualization</button>

        <!-- CAD hints (compact single-line) -->
        <div class="cad-instructions">
            <code>Ctrl+RClick</code> Rotate &nbsp;·&nbsp;
            <code>LClick</code> Pan &nbsp;·&nbsp;
            <code>Scroll</code> Zoom &nbsp;·&nbsp;
            <code>Ctrl+LClick</code> Next Step
        </div>

        <!-- Step controls -->
        <div class="step-controls">
            <h3 data-i18n="calc_steps">Calculation Steps</h3>
            <div class="step-buttons">
                <button id="btn-prev-step" class="btn-step" disabled>&larr; <span data-i18n="prev">Prev</span></button>
                <span id="step-counter" class="step-counter">
                    <span id="current-step-num">1</span>/<span id="total-step-num">6</span>
                </span>
                <button id="btn-next-step" class="btn-step"><span data-i18n="next">Next</span> &rarr;</button>
            </div>
            <div class="dots-container" id="dots-container"></div>
        </div>

    </aside>

    <!-- ═══════════ Main Area ═══════════ -->
    <main class="main-content">
        <div class="viz-container glass-panel">
            <!-- Three.js canvas injected here -->
        </div>
        <div class="math-container glass-panel">
            <h2 id="step-title" class="step-title">[Step Title]</h2>
            <div id="step-description" class="step-description"></div>
            <div class="formula-block glass-inset" id="formula-block"></div>
        </div>
    </main>

</div>
<script src="renderer.js"></script>
</body>
</html>
