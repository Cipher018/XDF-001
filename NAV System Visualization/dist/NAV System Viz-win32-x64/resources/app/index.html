<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDF-001 NAV Visualization</title>
    <!-- Modern Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Left Sidebar: Controls & Inputs -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h1 data-i18n="app_title">NAV System 3D Viz</h1>
                <button id="lang-toggle" class="btn-icon" title="Toggle Language">EN / ES</button>
            </div>

            <div class="control-group">
                <label data-i18n="mode_label">Navigation Mode</label>
                <div class="toggle-switch-container">
                    <button id="mode-waypoint" class="btn-toggle active" data-i18n="mode_waypoint">Waypoint</button>
                    <button id="mode-orbit" class="btn-toggle" data-i18n="mode_orbit">Orbit</button>
                </div>
            </div>

            <div class="control-section" id="drone-inputs">
                <h3 data-i18n="drone_state">Current Drone State</h3>
                <div class="input-row">
                    <div class="input-field">
                        <label>X (m)</label>
                        <input type="number" id="drone-x" value="0" step="1">
                    </div>
                    <div class="input-field">
                        <label>Y (m)</label>
                        <input type="number" id="drone-y" value="0" step="1">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-field">
                        <label data-i18n="heading">Heading (°)</label>
                        <input type="number" id="drone-heading" value="90" step="1" min="0" max="360">
                    </div>
                    <div class="input-field">
                        <label data-i18n="speed">Speed (m/s)</label>
                        <input type="number" id="drone-speed" value="10" step="1" min="0">
                    </div>
                </div>
            </div>

            <div class="control-section" id="target-inputs">
                <h3 id="target-title" data-i18n="target_waypoint">Target Waypoint</h3>
                <div class="input-row">
                    <div class="input-field">
                        <label>Target X</label>
                        <input type="number" id="target-x" value="100" step="1">
                    </div>
                    <div class="input-field">
                        <label>Target Y</label>
                        <input type="number" id="target-y" value="100" step="1">
                    </div>
                </div>
                
                <div class="input-row" id="orbit-specific-inputs" style="display: none;">
                    <div class="input-field">
                        <label data-i18n="orbit_radius">Radius (m)</label>
                        <input type="number" id="orbit-radius" value="50" step="1" min="5">
                    </div>
                    <div class="input-field">
                        <label data-i18n="orbit_dir">Direction</label>
                        <select id="orbit-dir">
                            <option value="cw" data-i18n="dir_cw">CW / Horario</option>
                            <option value="ccw" data-i18n="dir_ccw">CCW / C. Horario</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="btn-update" class="btn-primary" data-i18n="update_viz">Update Visualization</button>
            </div>

            <div class="cad-instructions">
                <b>CAD Camera Controls:</b><br/>
                <code>Ctrl + RClick</code> Rotate<br/>
                <code>LClick</code> Pan<br/>
                <code>Scroll</code> Zoom<br/>
                <code>Ctrl + LClick</code> Next Step
            </div>
            
            <div class="step-controls">
                <h3 data-i18n="calc_steps">Calculation Steps</h3>
                <div class="step-buttons">
                    <button id="btn-prev-step" class="btn-step" disabled>&larr; <span data-i18n="prev">Prev</span></button>
                    <span id="step-counter" class="step-counter">Step <span id="current-step-num">1</span>/<span id="total-step-num">4</span></span>
                    <button id="btn-next-step" class="btn-step"><span data-i18n="next">Next</span> &rarr;</button>
                </div>
                
                <div class="step-indicator">
                    <!-- Dots will be populated dynamically via JS -->
                    <div class="dots-container" id="dots-container"></div>
                </div>
            </div>
            
        </aside>

        <!-- Main Content Area: Visualization & Math Explained -->
        <main class="main-content">
            <div class="viz-container glass-panel">
                <!-- Three.js Canvas injected here -->
            </div>
            
            <div class="math-container glass-panel">
                <h2 id="step-title" class="step-title">[Step Title]</h2>
                <div id="step-description" class="step-description">
                    <!-- Math explanations will be injected here -->
                </div>
                <!-- Math formula block -->
                <div class="formula-block glass-inset" id="formula-block">
                    <!-- KaTeX math injected here -->
                </div>
            </div>
        </main>
        
    </div>
        </main>
        
    </div>

    <!-- Scripts -->
    <script src="renderer.js"></script>
</body>
</html>
